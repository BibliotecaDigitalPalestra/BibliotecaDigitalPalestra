<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Colecciones · Internet Organizado Total</title>

  <!-- CSS (ruta correcta para GitHub Pages con subcarpeta) -->
  <link rel="stylesheet" href="/BibliotecaDigitalPalestra/styles.css" />
</head>
<body>

<header class="topbar">
  <a href="index.html">
    <img src="assets/Logo.png" class="logo" alt="Biblioteca Digital Palestra">
  </a>
  <div class="brand">
    <div class="kicker">Biblioteca Multimedia</div>
    <h1>Internet Organizado Total</h1>
  </div>
</header>

<main class="wrap">
  <h2>Colecciones</h2>
  <p>Explora las colecciones curatoriales de la biblioteca.</p>

  <section class="collections-grid">

    <a class="collection-card"
       href="coleccion-patrimonio.html"
       style="--bg:linear-gradient(135deg,#19566d,#0f2f3d);">
      <span class="collection-title">Patrimonio Cuencano</span>
    </a>

    <a class="collection-card"
       href="coleccion-autores.html"
       style="--bg:linear-gradient(135deg,#555,#333);">
      <span class="collection-title">Autores y Ensayo</span>
    </a>

    <a class="collection-card"
       href="coleccion-educacion.html"
       style="--bg:linear-gradient(135deg,#6b7280,#374151);">
      <span class="collection-title">Educación y Escuelas</span>
    </a>

    <a class="collection-card"
       href="coleccion-revistas.html"
       style="--bg:linear-gradient(135deg,#4b5563,#1f2937);">
      <span class="collection-title">Revistas y Periódicos</span>
    </a>

    <a class="collection-card"
       href="coleccion-arte.html"
       style="--bg:linear-gradient(135deg,#7c6f64,#3f3a36);">
      <span class="collection-title">Arte y Fotografía</span>
    </a>

    <a class="collection-card"
       href="coleccion-musica.html"
       style="--bg:linear-gradient(135deg,#3b5d73,#1e3a4c);">
      <span class="collection-title">Música y Audio</span>
    </a>

  </section>
